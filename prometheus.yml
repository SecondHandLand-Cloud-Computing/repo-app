global:
  scrape_interval: 15s      # Tần suất Prometheus đi thu thập metrics
  scrape_timeout: 10s       # Timeout mỗi lần scrape (phải < scrape_interval)
  evaluation_interval: 15s  # Tần suất đánh giá alerting rules


scrape_configs:
  - job_name: "backend"
    static_configs:
      - targets: ["backend:5000"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "mongodb"
    static_configs:
      - targets: ["mongodb-exporter:9216"]
