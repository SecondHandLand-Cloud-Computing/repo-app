x-backend-common: &backend-common
  build:
    context: ./server
  image: cloud_backend:latest
  env_file:
    - ./server/.env
  environment:
    NODE_ENV: production
    PORT: "5000"
    MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/admin?authSource=admin
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    JWT_SECRET: local-dev-secret-change-me
    COOKIE_SECURE: "false"
    CORS_ORIGIN: "http://localhost"
    RABBITMQ_URL: amqp://rabbitmq:5672
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 512M

services:

  # ── Nginx Load Balancer ────────────────────────────────────────────────────
  nginx-lb:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    restart: unless-stopped

  # ── 3 Backend Node.js Instances ───────────────────────────────────────────
  backend-1:
    <<: *backend-common
    container_name: backend-1
    environment:
      NODE_ENV: production
      PORT: "5000"
      INSTANCE_ID: "1"
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/admin?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: local-dev-secret-change-me
      COOKIE_SECURE: "false"
      CORS_ORIGIN: "http://localhost"
      RABBITMQ_URL: amqp://rabbitmq:5672

  backend-2:
    <<: *backend-common
    container_name: backend-2
    environment:
      NODE_ENV: production
      PORT: "5000"
      INSTANCE_ID: "2"
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/admin?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: local-dev-secret-change-me
      COOKIE_SECURE: "false"
      CORS_ORIGIN: "http://localhost"
      RABBITMQ_URL: amqp://rabbitmq:5672

  backend-3:
    <<: *backend-common
    container_name: backend-3
    environment:
      NODE_ENV: production
      PORT: "5000"
      INSTANCE_ID: "3"
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/admin?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: local-dev-secret-change-me
      COOKIE_SECURE: "false"
      CORS_ORIGIN: "http://localhost"
      RABBITMQ_URL: amqp://rabbitmq:5672

  # ── Frontend (1 instance duy nhất) ────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost
    image: cloud_frontend:latest
    ports:
      - "5173:80"
    volumes:
      # Override nginx config: trỏ /api/ → nginx-lb thay vì backend:5000
      - ./nginx/nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nginx-lb
    restart: unless-stopped

  # ── Shared Infrastructure ──────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cloud_db
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── Monitoring Stack ───────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=dark
      # Tắt các request ra ngoài internet (tránh lỗi TLS)
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_PLUGINS_CHECK_FOR_UPDATES=false
      - GF_FEATURE_TOGGLES_ENABLE=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    restart: unless-stopped


volumes:
  mongo_data:
  redis_data:
  grafana_data:
