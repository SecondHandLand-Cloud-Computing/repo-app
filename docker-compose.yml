version: "3.8"

services:
  # frontend:
  #   build:
  #     context: ./client
  #     dockerfile: Dockerfile
  #   image: cloud_frontend:latest
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

  backend:
    build:
      context: ./server
    image: cloud_backend:latest
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=false
    depends_on:
      # Khóa bảo vệ: Ép Backend phải kiên nhẫn chờ đến khi Mongo và Redis báo "healthy" thì mới được chạy
      # mongo:
      #   condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # mongo:
  #   image: mongo:7.0
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo_data:/data/db # Ánh xạ ổ cứng thật vào container để dữ liệu không bị mất khi tắt máy
  #   environment:
  #     - MONGO_INITDB_DATABASE=cloud_db
  #     - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
  #     - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
  #   healthcheck:
  #     # KIỂM TRA: Cứ mỗi 10s, dùng lệnh 'mongosh' gõ cửa hỏi xem DB đã sẵn sàng nhận request chưa
  #     test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 5
  #   restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
      # Redis sẽ snapshot nếu có ít nhất 1 thay đổi trong 60s
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      # KIỂM TRA: Gõ lệnh 'ping', nếu Redis sống nó sẽ trả lời là 'PONG'
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro #để cAdvisor biết container nào đang chạy
      - /sys:/sys:ro #lấy được: CPU usage, memory limit, throttling
      - /var/lib/docker/:/var/lib/docker:ro #map container → metrics
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
